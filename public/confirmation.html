<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Confirmed – Raju Transport</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚛</text></svg>" />
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <div class="logo-icon">🚛</div>
      <div class="logo-text">
        <strong>Raju Transport</strong>
        <span>Guwahati → Imphal</span>
      </div>
    </a>
  </div>
</nav>

<div class="confirmation-page">
  <div class="confirmation-card">
    <div class="confirmation-icon">✅</div>
    <h2>Booking Submitted!</h2>
    <p>Your response has been submitted. Our coordinator will contact you via call or email within an hour.</p>

    <div class="confirmation-details" id="confirmDetails">
      <!-- Populated by JS -->
    </div>

    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <a href="/booking.html" class="btn btn-outline">📦 New Booking</a>
      <a href="/" class="btn btn-primary">🏠 Back to Home</a>
    </div>

    <div style="margin-top:24px;padding:16px;background:#fff8f0;border-radius:10px;border:1px solid #ffd6b0">
      <p style="font-size:13px;color:#c44d00;font-weight:600">📞 Need immediate help?</p>
      <p style="font-size:13px;color:#666;margin-top:4px">
        Call us: <a href="tel:9864010156" style="color:var(--primary);font-weight:600">9864010156</a> or
        <a href="tel:6002123739" style="color:var(--primary);font-weight:600">6002123739</a>
      </p>
    </div>
  </div>
</div>

<script>
  // Show booking details from sessionStorage
  const data = JSON.parse(sessionStorage.getItem('lastBooking') || '{}');
  const container = document.getElementById('confirmDetails');
  if (data.fullName) {
    container.innerHTML = `
      <div class="detail-row"><span>Name</span><span>${data.fullName}</span></div>
      <div class="detail-row"><span>Mobile</span><span>${data.mobile}</span></div>
      ${data.email ? `<div class="detail-row"><span>Email</span><span>${data.email}</span></div>` : ''}
      <div class="detail-row"><span>Goods Type</span><span>${data.goodsType}</span></div>
      <div class="detail-row"><span>Load Type</span><span>${data.loadType}</span></div>
    `;
  } else {
    container.style.display = 'none';
  }
</script>
</body>
</html>
