<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Shipment – Raju Transport</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚛</text></svg>" />
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <div class="logo-icon">🚛</div>
      <div class="logo-text">
        <strong>Raju Transport</strong>
        <span>Guwahati → Imphal</span>
      </div>
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="/">Home</a></li>
      <li><a href="/#services">Services</a></li>
      <li><a href="/#contact">Contact</a></li>
      <li><a href="#" id="navLogoutBtn" style="color:rgba(255,255,255,0.6)">Logout</a></li>
    </ul>
    <div class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </div>
  </div>
</nav>

<div class="page-section" style="background:var(--bg)">
  <div class="container">
    <div class="form-card">
      <div class="form-card-header">
        <h2>📦 Book a Shipment</h2>
        <p>Fill in the details below and our coordinator will get back to you within an hour.</p>
      </div>

      <div id="bookingAlert"></div>

      <form id="bookingForm">
        <div class="form-group">
          <label for="fullName">Full Name <span class="req">*</span></label>
          <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required />
          <div class="form-error hidden" id="nameError"></div>
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number <span class="req">*</span></label>
          <input type="tel" class="form-control" id="mobile" placeholder="10-digit mobile number" maxlength="10" required />
          <div class="form-error hidden" id="mobileError"></div>
        </div>

        <div class="form-group">
          <label for="email">Email ID <span style="color:var(--text-light);font-weight:400">(Optional)</span></label>
          <input type="email" class="form-control" id="email" placeholder="your@email.com" />
        </div>

        <div class="form-group">
          <label for="goodsType">Type of Goods <span class="req">*</span></label>
          <select class="form-control" id="goodsType" required>
            <option value="">Select type of goods</option>
            <option value="Furniture">🛋️ Furniture</option>
            <option value="Electronics">📱 Electronics</option>
            <option value="Construction Materials">🏗️ Construction Materials</option>
            <option value="FMCG / Retail Goods">🛒 FMCG / Retail Goods</option>
            <option value="Industrial Equipment">🏭 Industrial Equipment</option>
            <option value="Clothing & Textiles">👗 Clothing & Textiles</option>
            <option value="Food & Beverages">🍱 Food & Beverages</option>
            <option value="Medical Supplies">💊 Medical Supplies</option>
            <option value="General Cargo">📦 General Cargo</option>
            <option value="Other">Other</option>
          </select>
          <div class="form-error hidden" id="goodsError"></div>
        </div>

        <div class="form-group">
          <label>Load Type <span class="req">*</span></label>
          <div class="load-options">
            <div class="load-option">
              <input type="radio" name="loadType" id="ftl" value="Full Truck Load (FTL)" />
              <label for="ftl">
                <span class="load-icon">🚛</span>
                Full Truck Load
              </label>
            </div>
            <div class="load-option">
              <input type="radio" name="loadType" id="htl" value="Half Truck Load" />
              <label for="htl">
                <span class="load-icon">🚚</span>
                Half Truck Load
              </label>
            </div>
            <div class="load-option">
              <input type="radio" name="loadType" id="any" value="Any Quantity" />
              <label for="any">
                <span class="load-icon">📦</span>
                Any Quantity
              </label>
            </div>
          </div>
          <div class="form-error hidden" id="loadError"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="submitBtn" style="margin-top:8px">
          Submit Booking Request
        </button>
      </form>
    </div>
  </div>
</div>

<footer class="footer">
  <p>© 2024 <span>Raju Transport</span>. All rights reserved.</p>
</footer>

<script src="/js/app.js"></script>
<script src="/js/booking.js"></script>
</body>
</html>
